# Mini Claude Code CI/CD Pipeline
# Runs tests on push, PR, and schedule

name: Test Suite

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'constraints.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Daily regression tests at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
          - coverage

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Job 1: Lint and format check
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff 版本收敛到 constraints.txt 单一事实源（ISSUE-023：0.16 默认规则集扩容爆 1587 误报；
          # 规则集已由 pyproject [tool.ruff.lint] select 显式锁定，这里再锁工具版本防 format 行为漂移）
          pip install -c constraints.txt ruff

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  # Job 2: Unit tests (fast feedback)
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    env:
      # ISSUE-027 守卫：checkpoint 反序列化出现未白名单类型即硬失败（本地已全量验证）
      LANGGRAPH_STRICT_MSGPACK: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt：全部安装收敛到同一已验证依赖合面（ISSUE-023/024 漂移根治）
          pip install -e ".[dev]" -c constraints.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v -m "unit or not integration and not e2e and not stress and not chaos" --tb=short --junitxml=reports/junit/unit-tests.xml --cov=src/mini_claude --cov-report=xml:reports/coverage/unit-coverage.xml --cov-report=html:reports/coverage/html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/
          retention-days: 7

  # Job 3: Integration tests —— 每次 push/PR 都跑（此前仅 PR 触发，而本仓库直推 master，
  # 等于 integration 层在 CI 里从不运行，"CI 绿但 integration 假 mock"盲区由此而来）。
  # 断网护栏：OPENAI_BASE_URL 指向不可达端口，integration 层承诺全 mock，
  # 任何测试打真网即红（连接拒绝），防止"环境运气绿"混进 CI。
  integration-tests:
    name: Integration Tests (offline)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'schedule'
    env:
      OPENAI_BASE_URL: http://127.0.0.1:9
      OPENAI_API_KEY: sk-unreachable-guard
      # ISSUE-027 守卫：checkpoint serde 白名单外类型即硬失败
      LANGGRAPH_STRICT_MSGPACK: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Run integration tests
        # --cov-fail-under=0：单层覆盖率必然不达全局 fail_under=60（首跑 32.79% 翻车教训），
        # 60% 门槛留给全量 coverage job；这里保留 XML 报告作 artifact，但不卡门槛
        run: |
          python -m pytest tests/test_integration -m "not e2e" -v --tb=short --junitxml=reports/junit/integration-tests.xml --cov=src/mini_claude --cov-fail-under=0 --cov-report=xml:reports/coverage/integration-coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/
          retention-days: 7

  # Job 4: Full regression (daily or manual)
  regression-tests:
    name: Full Regression
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'full')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Run full regression suite
        run: |
          python scripts/run_regression.py --full --fail-on-regression
        continue-on-error: true

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: reports/
          retention-days: 30

      - name: Check for regressions
        if: always()
        run: |
          python -c "
          import json, glob, sys
          # 注意：不能在 shell 里用 `[ -f reports/regression_*.json ]`——
          # 通配符在 [ -f ] 内不展开，守卫恒为假，检测形同虚设。
          files = glob.glob('reports/regression_*.json')
          if not files:
              print('::warning::未生成回归报告（回归套件可能未运行）')
              sys.exit(0)
          with open(files[0]) as f:
              data = json.load(f)
          if data.get('total_failed', 0) > 0:
              print('::error::Regression tests failed: %d failures' % data['total_failed'])
              sys.exit(1)
          "

  # Job 5: Coverage report (PR only)
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Run coverage
        run: |
          python -m pytest tests/ -m "not integration" --cov=src/mini_claude --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  # Job 6: Notify on failure (for scheduled runs)
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, regression-tests]
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Scheduled test run failed - ' + new Date().toISOString().split('T')[0],
              body: 'The scheduled regression test run has failed.\n\n' +
                    'Check the workflow run: ' + process.env.GITHUB_SERVER_URL + '/' +
                    context.repo.owner + '/' + context.repo.repo + '/actions/runs/' +
                    context.runId,
              labels: ['ci-failure', 'automated']
            })
