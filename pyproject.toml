[project]
name = "mini-claude"
version = "0.1.0"
description = "A mini Claude Code with multi-agent concurrency"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "User", email = "user@example.com"}
]

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "langchain-core>=0.3.0",
    "litellm>=1.50.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.17.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",
]
web = [
    "ddgs>=6.0.0",
]
vector = [
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
server = [
    "aiohttp>=3.9.0",
]

[project.scripts]
mini-claude = "mini_claude.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_claude"]

[tool.ruff]
line-length = 100
target-version = "py310"

# 显式锁定规则集（= ruff 0.15 的默认集）。
# ruff 0.16 把默认规则集从 59 条扩到 413 条，不显式 select 时升级即爆
# 上千误报（ISSUE-023）；显式声明后 lint 结果与 ruff 版本解耦。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (database, API, etc.)",
    "e2e: End-to-end tests (full system)",
    "stress: Stress tests for high concurrency scenarios",
    "chaos: Chaos engineering tests for fault injection scenarios",
    "slow: Slow running tests (can be skipped with -m 'not slow')",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/mini_claude"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 60
show_missing = true

[tool.coverage.html]
directory = "reports/coverage"
